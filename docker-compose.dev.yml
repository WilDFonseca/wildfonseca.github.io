services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - dev_home:/home/dev
    user: dev
    init: true
    command: sleep infinity
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - development

volumes:
  dev_home:

networks:
  development:
    driver: bridge
